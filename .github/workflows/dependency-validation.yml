name: dependency-validation

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  mise-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834 # v5.1.0
        with:
          install: false
          experimental: true
      - run: mise install --locked --dry-run
