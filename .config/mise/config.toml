[bootstrap.macos.defaults.NSGlobalDomain]
# テキスト編集時の kill ring 履歴数。
# macOS デフォルト値: 1
NSTextKillRingSize = "4"
# 長押し時の Character Picker を無効化し、キーリピートを優先する。
# macOS デフォルト値: true
ApplePressAndHoldEnabled = false
# repeat count 入力のキーバインドを control-u にする。
# macOS デフォルト値: 未設定
NSRepeatCountBinding = "^u"
# Tab キー移動をすべてのコントロールに広げる。
# macOS デフォルト値: 2
AppleKeyboardUIMode = 3
# fn キーを標準ファンクションキーとして扱う。
# macOS デフォルト値: false
"com.apple.keyboard.fnState" = true
# キーリピート開始までの待ち時間を短くする。
# macOS デフォルト値: 25
InitialKeyRepeat = 15.0
# キーリピート速度を速くする。
# macOS デフォルト値: 6
KeyRepeat = 2.0
# スマートダッシュ置換を無効化する。
# macOS デフォルト値: true
NSAutomaticDashSubstitutionEnabled = false
# スマート引用符置換を無効化する。
# macOS デフォルト値: true
NSAutomaticQuoteSubstitutionEnabled = false
# スペル自動修正を無効化する。
# macOS デフォルト値: true
NSAutomaticSpellingCorrectionEnabled = false
# アプリ終了時にウィンドウ状態を復元しない。
# macOS デフォルト値: true
NSQuitAlwaysKeepsWindows = false
# ツールチップ表示までの待ち時間を短くする。
# macOS デフォルト値: 1000
NSInitialToolTipDelay = 100
# ウィンドウリサイズアニメーションを短くする。
# macOS デフォルト値: 0.2
NSWindowResizeTime = 0.001
# コンテキストメニューのサービス表示しきい値を上げる。
# macOS デフォルト値: 未設定
NSServicesMinimumItemCountForContextSubmenu = 10
# 保存パネルを展開状態で開く。
# macOS デフォルト値: false
NSNavPanelExpandedStateForSaveMode = true
# メニューバーの透明効果を有効化する。
# macOS デフォルト値: true
AppleEnableMenuBarTransparency = true
# スクロールバー表示を自動にする。
# macOS デフォルト値: Automatic
AppleShowScrollBars = "Automatic"
# すべての拡張子を表示する。
# macOS デフォルト値: false
AppleShowAllExtensions = true


[bootstrap.macos.defaults."com.apple.driver.AppleBluetoothMultitouch.trackpad"]
# タップでクリックを有効化する。
# macOS デフォルト値: false
Clicking = true
# ドラッグロックを有効化する。
# macOS デフォルト値: false
DragLock = true


[bootstrap.macos.defaults."com.apple.dock"]
# Dock を自動的に隠す。
# macOS デフォルト値: false
autohide = true
# Dock が表示されるまでの遅延をなくす。
# macOS デフォルト値: 0.5
autohide-delay = 0.0
# Dock の最小化エフェクトを scale にする。
# macOS デフォルト値: genie
mineffect = "scale"
# ウィンドウをアプリケーションアイコンへしまう。
# macOS デフォルト値: false
minimize-to-application = true
# 非表示アプリの Dock アイコンを半透明にする。
# macOS デフォルト値: false
showhidden = true
# Dock の拡大表示を有効化する。
# macOS デフォルト値: false
magnification = true
# スタックにマウスオーバーのハイライトを付ける。
# macOS デフォルト値: false
mouse-over-hilite-stack = true
# 起動中アプリのインジケータを表示する。
# macOS デフォルト値: true
show-process-indicator = true
# Dashboard をオーバーレイ表示にする。
# macOS デフォルト値: false
dashboard-in-overlay = true
# Mission Control のアニメーション時間を短くする。
# macOS デフォルト値: 0.2
expose-animation-duration = 0.10000000149011612
# Dock に最近使ったアプリを表示しない。
# macOS デフォルト値: true
show-recents = false
# Dock のアイコンサイズ。
# macOS デフォルト値: 64
tilesize = 72.0

[bootstrap.macos.defaults."com.apple.finder"]
# Quick Look でフォルダを透過表示する。
# macOS デフォルト値: false
QLEnableXRayFolders = true
# Quick Look でテキスト選択を有効化する。
# macOS デフォルト値: false
QLEnableTextSelection = true
# Finder のアニメーションを抑制する。
# macOS デフォルト値: false
DisableAllAnimations = true
# Finder で不可視ファイルを表示しない。
# macOS デフォルト値: false
AppleShowAllFiles = false
# Finder のステータスバーを表示する。
# macOS デフォルト値: false
ShowStatusBar = true
# Finder のパスバーを表示する。
# macOS デフォルト値: false
ShowPathbar = true
# Finder の既定表示をリスト表示にする。
# macOS デフォルト値: icnv
FXPreferredViewStyle = "Nlsv"
# Finder 検索の既定範囲を現在のフォルダにする。
# macOS デフォルト値: SCev
FXDefaultSearchScope = "SCcf"
# 拡張子変更時の警告を無効化する。
# macOS デフォルト値: true
FXEnableExtensionChangeWarning = false
# Finder の新規ウィンドウをホームにする。
# macOS デフォルト値: PfDe
NewWindowTarget = "PfHm"
# Finder のパスバーをホーム起点で表示する。
# macOS デフォルト値: false
PathBarRootAtHome = true

[bootstrap.macos.defaults."com.apple.LaunchServices"]
# ダウンロードアプリの quarantine 警告を抑制する。
# macOS デフォルト値: true
LSQuarantine = false

[bootstrap.macos.defaults."com.apple.frameworks.diskimages"]
# ディスクイメージ検証をスキップする。
# macOS デフォルト値: false
skip-verify = true
# ロック済みディスクイメージの検証をスキップする。
# macOS デフォルト値: false
skip-verify-locked = true
# リモートディスクイメージの検証をスキップする。
# macOS デフォルト値: false
skip-verify-remote = true

[bootstrap.macos.defaults."com.apple.screencapture"]
# スクリーンショットの影を無効化する。
# macOS デフォルト値: false
disable-shadow = true

[bootstrap.macos.defaults."com.apple.screensaver"]
# スクリーンセーバ解除時にパスワードを要求する。
# macOS デフォルト値: 0
askForPassword = 1
# スクリーンセーバ解除時のパスワード要求遅延をなくす。
# macOS デフォルト値: 5
askForPasswordDelay = 0

[bootstrap.macos.defaults."com.apple.Terminal"]
# Terminal のセキュアキーボード入力を無効にしておく。
# macOS デフォルト値: false
SecureKeyboardEntry = false


[bootstrap.macos.defaults."com.apple.CrashReporter"]
# CrashReporter のダイアログを表示しない。
# macOS デフォルト値: crashreport
DialogType = "none"

[bootstrap.macos.defaults."com.apple.PowerChime"]
# 充電音を鳴らさない。
# macOS デフォルト値: false
ChimeOnNoHardware = true

[bootstrap.macos.defaults."com.apple.desktopservices"]
# ネットワークボリュームに .DS_Store を作らない。
# macOS デフォルト値: false
DSDontWriteNetworkStores = true

[bootstrap.macos.defaults."com.apple.universalaccess"]
# アクセシビリティのカーソルサイズを少し大きくする。
# macOS デフォルト値: 1
mouseDriverCursorSize = 2.004645347595215
# Ctrl + スクロールでズームする。
# macOS デフォルト値: false
closeViewScrollWheelToggle = true

[bootstrap.macos.defaults."com.apple.TimeMachine"]
# 新しいディスクを Time Machine 用に使うか確認しない。
# macOS デフォルト値: false
DoNotOfferNewDisksForBackup = true

[bootstrap.macos.defaults."com.apple.ActivityMonitor"]
# Activity Monitor の Dock アイコンを CPU 使用率表示にする。
# macOS デフォルト値: 0
IconType = 6
# Activity Monitor の表示カテゴリをすべてのプロセスにする。
# macOS デフォルト値: 100
ShowCategory = 100
# Activity Monitor のソート列を CPU 使用率にする。
# macOS デフォルト値: ProcessName
SortColumn = "CPUUsage"
# Activity Monitor のソート方向を降順にする。
# macOS デフォルト値: 1
SortDirection = 0

[bootstrap.hooks]
post-packages = "code --list-extensions | grep -vxFf - ~/.config/mise/vscode-extensions.txt | xargs -n1 code --install-extension || true"
post-defaults = "killall Dock Finder SystemUIServer PowerChime 2>/dev/null || true"
post-dotfiles = [
  # bat only discovers custom themes after rebuilding its binary asset cache.
  "command -v bat >/dev/null && bat cache --build >/dev/null",
  "chmod 700 ~/.ssh ~/.gnupg && find ~/.ssh/ ~/.gnupg/ -type f -exec chmod 600 {} + && find ~/.gnupg/ -type d -exec chmod 700 {} +",
]
final = [
  "fish -c 'curl -sL git.io/fisher | source && fisher update'",
  "test -d ~/.local/share/tmux/plugins/tpm || git clone https://github.com/tmux-plugins/tpm ~/.local/share/tmux/plugins/tpm",
  "~/.local/share/tmux/plugins/tpm/bin/install_plugins",
  "~/.config/herdr/sync-plugins.sh || true",
]
