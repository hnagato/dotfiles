[tools]
bun = "1.4.3"
deno = "2.9.7"
go = "1.27.2"
java = "liberica-21.0.6+10"
"github:JetBrains/kotlin" = { version = "v2.4.21", asset_pattern = "kotlin-compiler-*.zip" }
"asdf:mise-plugins/mise-lua" = "5.4.8"
node = "24.22.0"
"npm:@aku11i/phantom" = "6.2.0"
"npm:@biomejs/biome" = "2.5.15"
"npm:markdownlint-cli" = "0.49.1"
"npm:markdownlint-cli2" = "0.23.3"
"npm:neovim" = "5.5.0"
"npm:textlint" = "15.8.0"
"npm:ccusage" = "20.0.33"
pnpm = "12.13.0"
python = "3.15.0"
ruby = "3.4.11"
rust = "1.99.1"
shellcheck = "0.11.0"
tree-sitter = "0.27.1"
uv = "0.13.1"

# Homebrew-managed CLIs moved to mise so Renovate can propose version updates.
bat = "0.26.1"
eza = "0.23.5"
fastfetch = "2.70.0"
fd = "10.5.0"
fzf = "0.74.5"
gh = "2.102.0"
git-filter-repo = "2.47.0"
gitleaks = "8.30.1"
glow = "3.0.0"
hugo = "0.168.0"
hyperfine = "2.0.0"
jq = "1.8.2"
lazygit = "0.66.1"
pre-commit = "4.7.0"
starship = "1.26.0"
yazi = "26.9.1"

[settings]
idiomatic_version_file_enable_tools = ["node"]
experimental = true
lockfile = true
minimum_release_age = "7d"

[dotfiles]
"~/.config/bat" = "~/projects/hnagato/dotfiles/.config/bat"
"~/.config/fish" = "~/projects/hnagato/dotfiles/.config/fish"
"~/.config/ghostty" = "~/projects/hnagato/dotfiles/.config/ghostty"
"~/.config/git" = "~/projects/hnagato/dotfiles/.config/git"
"~/.config/herdr" = "~/projects/hnagato/dotfiles/.config/herdr"
"~/.config/karabiner" = { mode = "absent" }
"~/.config/lazygit" = "~/projects/hnagato/dotfiles/.config/lazygit"
"~/.config/leaf" = { mode = "absent" }
"~/.config/nvim" = "~/projects/hnagato/dotfiles/.config/nvim"
"~/.config/starship.toml" = "~/projects/hnagato/dotfiles/.config/starship.toml"
"~/.config/tmux" = "~/projects/hnagato/dotfiles/.config/tmux"
"~/.config/tuna" = { mode = "absent" }
"~/.config/yazi" = "~/projects/hnagato/dotfiles/.config/yazi"
"~/.editorconfig" = "~/projects/hnagato/dotfiles/.editorconfig"
"~/.gnupg" = "~/projects/hnagato/dotfiles/.gnupg"
"~/.hammerspoon/init.lua" = "~/projects/hnagato/dotfiles/.hammerspoon/init.lua"
"~/.inputrc" = "~/projects/hnagato/dotfiles/.inputrc"
"~/.markdownlint-cli2.jsonc" = "~/projects/hnagato/dotfiles/.markdownlint-cli2.jsonc"
"~/.marksman.toml" = "~/projects/hnagato/dotfiles/.marksman.toml"
"~/.ssh" = "~/projects/hnagato/dotfiles/.ssh"
"~/.tigrc" = "~/projects/hnagato/dotfiles/.tigrc"
"~/.zshenv" = "~/projects/hnagato/dotfiles/.zshenv"
"~/.zshrc" = "~/projects/hnagato/dotfiles/.zshrc"

# Shared by every Mac. Machine-specific packages live in config.<env>.toml.
